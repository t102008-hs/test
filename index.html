<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4ECE4">
<meta name="description" content="香山國小數位校刊：班級與處室的校園點滴">
<title>香山國小數位校刊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0.36/dist/fancybox/fancybox.css">
<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0.36/dist/fancybox/fancybox.umd.js" defer></script>
<style>
:root{--bg:#F4ECE4;--ink:#3d312e;--dk:#7A635E;--tp:#B4968F;--pk:#F58595;--lt:#E8DEDC;--mute:#6f5d58;--serif:"Noto Serif TC","Songti TC","PMingLiU",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100dvh;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:1040px;margin:0 auto;padding:0 16px}
.mast{padding:calc(22px + env(safe-area-inset-top)) 4px 8px}
.mast h1{margin:0;font:700 1.6rem/1.25 var(--serif);color:var(--dk);letter-spacing:.06em}
.mast p{margin:8px 0 0;color:var(--mute);font-size:14px}
.bar2{position:sticky;top:0;z-index:15;margin:0 -16px;padding:calc(6px + env(safe-area-inset-top)) 16px 8px;background:rgba(244,236,228,.92);backdrop-filter:blur(10px)}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.mt button{flex:none;border:0;background:none;padding:10px 12px;min-height:44px;color:var(--mute);font-weight:500;position:relative}
.mt button[aria-pressed=true]{color:var(--dk);font-weight:700}
.mt button[aria-pressed=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:4px;height:3px;border-radius:3px;background:var(--pk)}
.sbr{padding-top:4px}.sbr button{flex:none;border:0;background:#fff;border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px;color:var(--ink)}
.sbr button[aria-pressed=true]{background:var(--dk);color:#fff}




.tg{display:inline-block;font-size:12px;background:rgba(255,255,255,.92);color:#5f4b46;padding:2px 11px;border-radius:999px}
.mas{display:grid;gap:16px;grid-template-columns:1fr}
.c{display:block;background:#fff;border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(90,64,58,.06),0 6px 18px rgba(90,64,58,.06)}
.c .im{position:relative;aspect-ratio:3/2;background:var(--lt)}
.c .im img{width:100%;height:100%;object-fit:cover;display:block}
.c .ph{display:grid;place-items:center;font:700 1.3rem var(--serif);color:rgba(122,99,94,.45);letter-spacing:.2em}
.c .tx{padding:14px 16px 16px}
.c b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:600 1.05rem/1.45 var(--serif);min-height:2.9em;overflow-wrap:anywhere}
.c small{display:block;margin-top:6px;color:var(--mute);font-size:13px}.c .tx .tg{background:var(--lt);margin-bottom:8px}


i.pl{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.more{display:block;margin:6px auto 0;border:0;border-radius:999px;background:#fff;padding:0 28px;min-height:46px;color:var(--dk);font-weight:700}
.empty{text-align:center;color:var(--mute);padding:48px 0}
.pick{margin:6px 0 18px}.pick label{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
.pick select{width:100%;max-width:340px;min-height:48px;border:0;border-radius:14px;background:#fff;padding:0 14px;font:inherit;color:var(--ink)}
nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(92%,340px);display:flex;padding:6px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);box-shadow:0 8px 28px rgba(90,64,58,.2)}
nav button{flex:1;border:0;background:none;border-radius:999px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--mute)}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=true]{background:var(--lt);color:var(--dk);font-weight:700}
#sv{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding:calc(14px + env(safe-area-inset-top)) 16px 120px}
#sv .top{display:flex;gap:8px;align-items:center;max-width:1040px;margin:0 auto 14px}
#q{flex:1;min-width:0;border:0;background:#fff;border-radius:999px;padding:0 20px;min-height:50px;font:inherit;color:var(--ink)}
#sx{border:0;background:none;color:var(--dk);min-height:44px;padding:0 6px}
#sr{max-width:1040px;margin:0 auto}
#art{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.ab{position:sticky;top:0;height:0;z-index:3}
.ab button{position:absolute;top:calc(12px + env(safe-area-inset-top));width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);color:var(--dk);font-size:20px;font-weight:700}
#close{left:14px}#share{right:14px}
.ah{display:block;aspect-ratio:4/3;max-height:60dvh;background:var(--lt);overflow:hidden}.ah img{width:100%;height:100%;object-fit:cover;display:block}
#art article{position:relative;max-width:760px;margin:-30px auto 0;padding:26px 22px calc(48px + env(safe-area-inset-bottom));background:var(--bg);border-radius:30px 30px 0 0}
#art article.nh{margin-top:64px;border-radius:0}
#art h2{margin:10px 0 6px;font:700 1.75rem/1.35 var(--serif);color:var(--dk);overflow-wrap:anywhere}
.meta{margin:0 0 18px;color:var(--mute);font-size:14px}
#art .tg{background:var(--lt)}
.body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.0625rem;line-height:2;margin:0 0 22px}
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mg a{position:relative;display:block;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--lt)}
.mg img{width:100%;height:100%;object-fit:cover;display:block}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 18px;border-radius:999px;z-index:90}
.adm{display:none;text-align:center;font-size:13px;margin-top:28px}.adm a{color:var(--mute)}
@media(hover:hover){.c:hover{box-shadow:0 10px 26px rgba(90,64,58,.14)}}
@media(min-width:640px){.mas{grid-template-columns:1fr 1fr}.adm{display:block}.mg{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.mas{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" aria-label="主選單">
<button data-t="home" aria-label="首頁"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>首頁</button>
<button data-t="search" aria-label="搜尋"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>搜尋</button>
<button data-t="mine" aria-label="我的班級"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5l-5.4 3 1.2-6L3.3 9.3l6.1-.7z"/></svg>我的班級</button>
</nav>
<div id="sv" hidden><div class="top"><input id="q" type="search" placeholder="搜尋標題、作者、班級" enterkeyhint="search" aria-label="搜尋"><button id="sx">取消</button></div><div id="sr"></div></div>
<div id="art" hidden></div>
<script>
var API='https://script.google.com/macros/s/AKfycbx0WYcfguRrU0oj-BMRjnwrz6LySteDiy7ZMuF4WnaoKFJoqtL3nF3Bpe0M7bm2PG9Z/exec?api=true';
var CATAPI=API.replace('api=true','api=categories'),ADMIN='https://script.google.com/a/macros/tmail.hc.edu.tw/s/AKfycbyirrh5kS5_rp8bgyqts7ciy_PaLOBgiK84H7WaAVtnYs1OkCT3c_Kdn57diJFt_B-2/exec';
var $=s=>document.querySelector(s);
var esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
var lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
var lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
var A=[],C={order:[],map:{}},st={main:'',sub:'',tab:'home'},N=20,loaded=false;
var TINTS=['#E8DEDC','#E3E0D3','#DCE2DE','#EADFCF','#E6D6D3'],RATIO=['4/5','1/1','5/6'];

function media(g){
  return String(g||'').split(/[\n,]+/).map(u=>u.split('|||')[0].trim()).filter(Boolean).map(u=>{
    var m=u.match(/youtu(?:\.be\/|be\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([\w-]{11})/);
    if(m)return{yt:1,thumb:'https://img.youtube.com/vi/'+m[1]+'/hqdefault.jpg',full:'https://www.youtube.com/watch?v='+m[1]};
    m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]{10,})/);
    if(!m)return null;
    var b='https://lh3.googleusercontent.com/d/'+m[1];
    return{thumb:b+'=w500',mid:b+'=w1000',full:b+'=w1600'};
  }).filter(Boolean);
}
var uniq=(v,i,r)=>v&&r.indexOf(v)===i;
function mains(){
  var have=A.map(a=>a.main_category).filter(uniq),ord=C.order.filter(m=>have.indexOf(m)>=0);
  return ord.concat(have.filter(m=>ord.indexOf(m)<0));
}
function subsOf(main){
  var have=A.filter(a=>a.main_category===main).map(a=>a.sub_category).filter(uniq),ord=(C.map[main]||[]).filter(s=>have.indexOf(s)>=0);
  return ord.concat(have.filter(s=>ord.indexOf(s)<0));
}
var tint=a=>{var s=String(a.id),h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%5;return TINTS[h]};
var dsort=l=>l.slice().sort((a,b)=>(b.publish_date||'').localeCompare(a.publish_date||''));
var byline=a=>[a.author?'作者 '+esc(a.author):'',esc(a.publish_date)].filter(Boolean).join('　');

function card(a){
  var m=media(a.gallery)[0],h='#/a/'+esc(a.id);
  return '<a class="c" href="'+h+'" data-id="'+esc(a.id)+'"><div class="im'+(m?'':' ph')+'"'+(m?'':' style="background:'+tint(a)+'"')+'>'+(m?'<img loading="lazy" decoding="async" src="'+m.thumb+'" alt="">'+(m.yt?'<i class="pl">▶</i>':''):'校刊')+'</div><div class="tx"><span class="tg">'+esc(a.sub_category||a.main_category)+'</span><b>'+esc(a.title||'（未命名）')+'</b><small>'+byline(a)+'</small></div></a>';
}
var mas=l=>'<div class="mas">'+l.map(card).join('')+'</div>';
var empty=t=>'<p class="empty">'+t+'</p>';
var mast=(t,p)=>'<div class="mast"><h1>'+t+'</h1>'+(p?'<p>'+p+'</p>':'')+'</div>';

function render(){
  var sv=!$('#sv').hidden;
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.t===(sv?'search':st.tab))));
  var app=$('#app');
  if(!A.length){app.innerHTML=mast('香山國小數位校刊')+empty(loaded?'目前還沒有文章。':'載入中…');return}
  if(st.tab==='mine'){
    var mine=lsGet('myClass'),sel='<select id="mine" aria-label="我的班級"><option value="">請選擇</option>';
    mains().forEach(m=>{sel+='<optgroup label="'+esc(m)+'">'+subsOf(m).map(s=>'<option value="'+esc(s)+'"'+(s===mine?' selected':'')+'>'+esc(s)+'</option>').join('')+'</optgroup>'});
    sel+='</select>';
    var ml=mine?dsort(A.filter(a=>a.sub_category===mine)):[];
    app.innerHTML=mast('我的班級',mine?esc(mine)+'：共 '+ml.length+' 篇':'選一次，下次直接看到')+'<div class="pick"><label for="mine">'+(mine?'更換班級':'請選擇你的班級')+'</label>'+sel+'</div>'+(ml.length?mas(ml):(mine?empty('這個班級目前還沒有內容。'):''));
    return;
  }
  var ms=mains(),list=dsort(A.filter(a=>(!st.main||a.main_category===st.main)&&(!st.sub||a.sub_category===st.sub)));
  var rest=list,shown=list.slice(0,N);
  var tabs=[''].concat(ms).map(m=>'<button data-m="'+esc(m)+'" aria-pressed="'+(st.main===m)+'">'+(m?esc(m.length>5?'幼兒園':m):'全部')+'</button>').join('');
  var subs=st.main?[''].concat(subsOf(st.main)).map(s=>'<button data-s="'+esc(s)+'" aria-pressed="'+(st.sub===s)+'">'+(s?esc(s):'全部班級')+'</button>').join(''):'';
  app.innerHTML=mast('香山國小數位校刊','校園點滴，一起看')+'<div class="bar2"><div class="row mt">'+tabs+'</div>'+(subs?'<div class="row sbr">'+subs+'</div>':'')+'</div>'+
    (shown.length?mas(shown):empty('這個分類目前還沒有內容。'))+
    (rest.length>N?'<button class="more" id="more">看更多</button>':'')+'<p class="adm"><a href="'+ADMIN+'" target="_blank" rel="noopener">教師後台</a></p>';
}
function results(){
  var q=$('#q').value.trim().toLowerCase(),box=$('#sr');
  if(!q){box.innerHTML=empty('輸入標題、作者或班級');return}
  var r=dsort(A.filter(a=>[a.title,a.author,a.sub_category,a.main_category,a.content].join(' ').toLowerCase().indexOf(q)>=0));
  box.innerHTML=(r.length?mas(r):empty('找不到相關內容，換個關鍵字試試。'));
}
function openSearch(){$('#sv').hidden=false;document.body.style.overflow='hidden';render();results();$('#q').focus()}
function closeSearch(){$('#sv').hidden=true;$('#q').value='';if($('#art').hidden)document.body.style.overflow='';render()}

/* ---------- 文章頁 ---------- */
var baseTitle=document.title;
function showArt(id){
  var a=A.filter(x=>String(x.id)===id)[0];
  if(!a){if(loaded)closeArt();return}
  var ms=media(a.gallery),h=ms[0],rest=ms.slice(1),alt=esc(a.title||a.sub_category);
  var lnk=(m,src)=>'<a data-fancybox="g" href="'+m.full+'"><img loading="lazy" decoding="async" src="'+src+'" alt="'+alt+'">'+(m.yt?'<i class="pl">▶</i>':'')+'</a>';
  var el=$('#art');
  el.innerHTML='<div class="ab"><button id="close" aria-label="返回">‹</button><button id="share" aria-label="分享">↗</button></div>'+
    (h?'<a class="ah" data-fancybox="g" href="'+h.full+'"><img src="'+(h.mid||h.thumb)+'" alt="'+alt+'"></a>':'')+
    '<article'+(h?'':' class="nh"')+'><span class="tg">'+esc(a.sub_category||a.main_category)+'</span>'+(a.title?'<h2>'+esc(a.title)+'</h2>':'')+(byline(a)?'<p class="meta">'+byline(a)+'</p>':'')+
    (a.content?'<div class="body">'+esc(a.content)+'</div>':'')+(rest.length?'<div class="mg">'+rest.map(m=>lnk(m,m.thumb)).join('')+'</div>':'')+'</article>';
  el.hidden=false;el.scrollTop=0;document.body.style.overflow='hidden';
  document.title=(a.title||a.sub_category)+' - 香山國小數位校刊';
}
function hideArt(){$('#art').hidden=true;if($('#sv').hidden)document.body.style.overflow='';document.title=baseTitle}
function route(){var m=location.hash.match(/^#\/a\/([\w-]+)/);if(m)showArt(m[1]);else hideArt()}
function openArt(id){history.pushState({n:1},'','#/a/'+id);route()}
function closeArt(){
  if(history.state&&history.state.n)history.back();
  else{history.replaceState(null,'',location.pathname+location.search);route()}
}
function toast(t){var d=document.createElement('div');d.id='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
function share(){
  var t=document.title,u=location.href;
  if(navigator.share)navigator.share({title:t,url:u}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast('已複製連結'));
}

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  var t=e.target.closest('[data-id],[data-t],[data-m],[data-s],#more,#close,#share,#sx');
  if(!t)return;
  if(t.dataset.id!=null){if(e.metaKey||e.ctrlKey||e.button)return;e.preventDefault();openArt(t.dataset.id);return}
  if(t.id==='close')return closeArt();
  if(t.id==='share')return share();
  if(t.id==='sx')return closeSearch();
  if(t.id==='more'){N+=20;return render()}
  if(t.dataset.t!=null){
    if(t.dataset.t==='search')return openSearch();
    $('#sv').hidden=true;$('#q').value='';document.body.style.overflow='';
    st.tab=t.dataset.t;
  }else if(t.dataset.m!=null){st.main=t.dataset.m;st.sub='';N=20}
  else if(t.dataset.s!=null){st.sub=t.dataset.s;N=20}
  render();
  if(t.dataset.t!=null)window.scrollTo(0,0);
});
document.addEventListener('change',e=>{
  if(e.target.id==='mine'){
    if(e.target.value)lsSet('myClass',e.target.value);else try{localStorage.removeItem('myClass')}catch(x){}
    render();
  }
});
var qt;$('#q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(results,200)});
addEventListener('popstate',route);
addEventListener('load',()=>{if(window.Fancybox)Fancybox.bind('[data-fancybox]',{Hash:false})});

/* ---------- 載入：先顯示上次快取，背景更新 ---------- */
(function(){
  var c=lsGet('xs_v2');
  if(c&&c.a){A=c.a;C=c.c||C;loaded=true}
  render();route();
  Promise.all([
    fetch(API).then(r=>r.json()),
    fetch(CATAPI).then(r=>r.json()).catch(()=>null)
  ]).then(res=>{
    if(!Array.isArray(res[0]))throw new Error('bad data');
    A=res[0];if(res[1]&&res[1].order)C=res[1];
    loaded=true;lsSet('xs_v2',{a:A,c:C});render();route();
  }).catch(()=>{if(!A.length)$('#app').innerHTML=mast('香山國小數位校刊')+empty('載入失敗，請確認網路連線後重新整理。')});
})();
</script>
</body>
</html>
